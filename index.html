<!DOCTYPE html>
<html lang="en">
<head>
<meta name="app-version" content="1">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Cricket Scorer</title>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Barlow:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#eef1e6;--card:#fbfcf7;--ink:#1c2b1d;--mute:#6a7a67;--green:#1f5a30;--on:#fff;--red:#b3261e;--line:#d3dac8;--amber:#c98a12;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0e1710;--card:#16231a;--ink:#eaf0e2;--mute:#8fa28b;--green:#4fa76a;--on:#08140b;--red:#ff6b5e;--line:#2a3b2d;--amber:#e3a835}}
:root[data-theme="dark"]{--bg:#0e1710;--card:#16231a;--ink:#eaf0e2;--mute:#8fa28b;--green:#4fa76a;--on:#08140b;--red:#ff6b5e;--line:#2a3b2d;--amber:#e3a835}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.4 Barlow,system-ui,sans-serif}
main{max-width:480px;margin:0 auto;padding:14px}
h1,.num{font-family:"Barlow Condensed","Arial Narrow",sans-serif;margin:0}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:12px}
.team{font-weight:600;color:var(--mute)}
.score{font-size:72px;line-height:.95;font-weight:700;letter-spacing:-1px}
.score small{font-size:32px;color:var(--mute);font-weight:600}
.meta{display:flex;gap:16px;color:var(--mute);margin-top:6px;flex-wrap:wrap}
.meta b{color:var(--ink)}
.msg{margin-top:10px;padding:8px 10px;border-radius:8px;background:var(--bg);font-weight:600}
.over{display:flex;gap:6px;flex-wrap:wrap;min-height:38px;align-items:center}
.ball{min-width:36px;height:36px;border-radius:50%;display:grid;place-items:center;border:2px solid var(--line);font:700 15px "Barlow Condensed",sans-serif;padding:0 4px}
.ball.f{border-color:var(--green);color:var(--green)}
.ball.x{border-color:var(--amber);color:var(--amber)}
.ball.w{background:var(--red);border-color:var(--red);color:#fff}
.pad{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
button{font-family:inherit}
.pad button,.mods button,.row button{font:700 28px "Barlow Condensed",sans-serif;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:12px;height:62px;cursor:pointer}
.pad button:active{transform:scale(.96)}
.pad .b4,.pad .b6{background:var(--green);color:var(--on);border-color:var(--green)}
.mods{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;margin-bottom:10px}
.mods button{font-size:20px;height:46px}
.mods button.on{background:var(--amber);color:#111;border-color:var(--amber)}
.mods button.wk.on{background:var(--red);color:#fff;border-color:var(--red)}
.row{display:flex;gap:8px;margin-top:10px}
.row button{flex:1;font-size:18px;height:44px}
.go{background:var(--green)!important;color:var(--on)!important;border-color:var(--green)!important;width:100%;height:52px!important;font-size:22px!important}
label{display:block;font-weight:600;margin:10px 0 4px}
input,select,textarea{width:100%;font:inherit;padding:11px;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--ink)}
textarea{min-height:90px}
:focus-visible{outline:3px solid var(--amber);outline-offset:2px}
.hint{color:var(--mute);font-size:14px;margin:6px 0 0}
table{width:100%;border-collapse:collapse}td{padding:4px 0}td.r{text-align:right;white-space:nowrap}
.pl td{border-bottom:1px solid var(--line)}.pl tr:last-child td{border:0}
.str{font-weight:700}.pl span{cursor:pointer;text-decoration:underline dotted}.out{color:var(--mute)}
.dev{text-align:center;color:var(--mute);font-size:14px;padding:6px 14px 22px}
.top{display:flex;align-items:center;justify-content:space-between;padding:4px 2px 8px}
.logo{font:700 26px "Barlow Condensed",sans-serif;letter-spacing:.3px}
.me{background:var(--card);border:1px solid var(--line);border-radius:999px;padding:4px 12px;font-size:14px;color:var(--mute);font-weight:600}
.tabs{display:flex;gap:8px;overflow-x:auto;position:sticky;top:0;z-index:20;background:var(--bg);padding:6px 14px 12px;margin:0 -14px 6px;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tabs button{flex:0 0 auto;display:flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--card);color:var(--ink);padding:9px 15px;border-radius:999px;font:600 15px Barlow,system-ui,sans-serif;cursor:pointer;box-shadow:0 1px 2px rgba(0,0,0,.06);transition:.15s}
.tabs button i{font-style:normal;font-size:16px}
.tabs button.on{background:var(--green);color:var(--on);border-color:var(--green);box-shadow:0 4px 12px rgba(31,90,48,.35)}
.card{box-shadow:0 1px 3px rgba(0,0,0,.06),0 6px 18px rgba(0,0,0,.04);border-radius:16px}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.rw{display:flex;justify-content:space-between;align-items:center;gap:8px}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin:10px 0}.chips span{background:var(--bg);border:1px solid var(--line);border-radius:999px;padding:3px 10px;font-size:13px;font-weight:600}
.bdg{font-size:12px;font-weight:700;padding:3px 9px;border-radius:999px;background:var(--bg);border:1px solid var(--line);color:var(--mute);white-space:nowrap}.bdg.liv{background:var(--red);border-color:var(--red);color:#fff}
.hero{background:linear-gradient(135deg,var(--card),var(--bg))}
.stage{text-align:center;border:2px solid var(--green)}.pname{font:700 36px "Barlow Condensed",sans-serif}.bidv{font:700 56px "Barlow Condensed",sans-serif;color:var(--green);margin:4px 0}
.bids{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:12px}.bids button{border:1px solid var(--green);background:var(--card);color:var(--ink);border-radius:12px;padding:10px 6px;font:700 16px Barlow,sans-serif;cursor:pointer}.bids button small{display:block;font-weight:600;color:var(--green)}.bids button:disabled{opacity:.45}
.sc{overflow-x:auto;margin-top:8px}.tb th{text-align:left;font-size:12px;color:var(--mute);text-transform:uppercase;letter-spacing:.5px;padding:6px 8px;border-bottom:2px solid var(--line)}.tb td{padding:9px 8px;border-bottom:1px solid var(--line);vertical-align:top}.tb tr.cur td{background:rgba(201,138,18,.15)}
summary{font-weight:600;cursor:pointer}
.cm{padding:6px 0;border-bottom:1px solid rgba(128,128,128,.25);font-size:14px}.cm b{margin-right:6px}details.ov{margin:6px 0;border:1px solid rgba(128,128,128,.35);border-radius:10px;padding:8px 10px}details.ov summary{cursor:pointer;font-weight:600}details.ov summary span{display:block;margin-top:6px}
</style>

<body>
<main id="app"></main>

<script>
var KEY="cricket-scorer-v2";
var S=load()||{setup:true,a:"",b:"",ov:5,raw:["",""],sq:[[],[]],inn:0,log:[[],[]],cur:[{},{}]};
var mod={x:null,w:false};
function load(){try{return JSON.parse(localStorage.getItem(KEY))}catch(e){return null}}
function save(){if(LIVE)return;try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}livePush()}
function maxW(i){return Math.max(1,Math.min(10,S.sq[i].length-1))}
function calc(i){var r=0,w=0,b=0;S.log[i].forEach(function(e){r+=e.t;if(e.w)w++;if(e.l)b++});return{r:r,w:w,b:b}}
function ended(i){var c=calc(i);if(c.b>=S.ov*6||c.w>=maxW(i))return true;return i===1&&c.r>calc(0).r}
function team(i){return i===0?S.a:S.b}
function ovr(n){return Math.floor(n/6)+"."+n%6}
function esc(s){return String(s).replace(/[&<>"]/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]})}
function stats(i){
 var B={},W={};
 S.log[i].forEach(function(e){
  var b=B[e.b]||(B[e.b]={r:0,b:0,f4:0,f6:0,o:false});
  if(e.k){b.ret=true;return}b.ret=false;b.r+=e.br;if(e.x!=="wd")b.b++;if(e.br===4)b.f4++;if(e.br===6)b.f6++;if(e.w){var oo=e.out||e.b,ob=B[oo]||(B[oo]={r:0,b:0,f4:0,f6:0,o:false});ob.o=true;ob.how=(e.dt||"Out")+((e.dt==="Run out"||!e.dt)?"":" b "+e.bw)}
  var w=W[e.bw]||(W[e.bw]={b:0,r:0,w:0});
  if(e.l)w.b++;w.r+=(e.x==="bye"||e.x==="lb")?0:e.t;if(e.w&&e.dt!=="Run out")w.w++;
 });
 return{B:B,W:W};
}
function chipOf(e){
 var lab={wd:"Wd",nb:"Nb",bye:"B",lb:"LB"}[e.x]||"";
 var runs=(e.x==="wd"||e.x==="nb")?e.t-1:e.t,s;
 if(e.w)s="W"+(runs?"+"+runs:"");
 else if(e.x==="bye"||e.x==="lb")s=lab+runs;
 else if(lab)s=lab+(runs?"+"+runs:"");
 else s=runs===0?"•":String(runs);
 return '<span class="ball '+(e.w?"w":lab?"x":(e.t>=4?"f":""))+'">'+s+'</span>';
}
function curOver(i){
 var cur=[],last=[],n=0;
 S.log[i].forEach(function(e){if(e.k)return;cur.push(e);if(e.l){n++;if(n%6===0){last=cur;cur=[]}}});
 return cur.length?cur:last;
}
function parse(t,p){
 var a=t.split(/[\n,]+/).map(function(s){return s.trim()}).filter(Boolean);
 if(a.length<2){a=[];for(var i=1;i<=11;i++)a.push(p+" "+i)}
 return a.filter(function(n,i){return a.indexOf(n)===i});
}
function g(id){var e=document.getElementById(id);return e?e.value.trim():""}
function startReal(){
 S.a=g("a")||"Team A";S.b=g("b")||"Team B";S.ov=Math.max(1,Math.min(50,parseInt(g("ov"))||5));
 S.raw=[document.getElementById("sa").value,document.getElementById("sb").value];
 S.sq=[parse(S.raw[0],"Player"),parse(S.raw[1],"Player")];
 if(S.sq[1][0]==="Player 1"&&S.sq[0][0]==="Player 1"){S.sq[0]=S.sq[0].map(function(n){return S.a+" "+n.split(" ")[1]});S.sq[1]=S.sq[1].map(function(n){return S.b+" "+n.split(" ")[1]})}
 if((g("ts")==="b")!==(g("te")==="bowl")){var t0=S.a;S.a=S.b;S.b=t0;S.sq.reverse();S.raw.reverse()}var T=loadT();T[S.a]=S.sq[0];T[S.b]=S.sq[1];saveT(T);S.setup=false;S.arch=0;S.inn=0;S.log=[[],[]];S.cur=[{},{}];save();render();
}
function outList(i){return S.log[i].filter(function(e){return e.w}).map(function(e){return e.out||e.b})}
function prevBowler(i){
 var l=S.log[i],n=calc(i).b;
 return(n>0&&n%6===0&&l.length)?l[l.length-1].bw:null;
}
function confirmPick(){
 var i=S.inn,c=S.cur[i],st=g("p_st")||c.st,ns=g("p_ns")||c.ns,bw=g("p_bw")||c.bw;
 if(st&&ns&&st===ns){alert("Striker and non-striker must be different players.");return}
 c.st=st||null;c.ns=ns||null;c.bw=bw||null;save();render();
}
function add(n){
 var i=S.inn,c=S.cur[i];if(ended(i)||!c.st||!c.ns||!c.bw)return;
 var x=mod.x,e={t:n,l:true,w:mod.w,x:x,b:c.st,bw:c.bw,br:(x===null||x==="nb")?n:0,s:{st:c.st,ns:c.ns,bw:c.bw}};
 if(x==="wd"||x==="nb"){e.t=n+1;e.l=false}
 if(e.w){e.dt=g("dt")||"Bowled";e.out=g("dw")==="ns"?c.ns:c.st}
 S.log[i].push(e);
 if(e.w){if(e.out===c.st)c.st=null;else c.ns=null}
 if(n%2===1){var t=c.st;c.st=c.ns;c.ns=t}
 if(e.l&&calc(i).b%6===0){var t2=c.st;c.st=c.ns;c.ns=t2;c.bw=null}
 mod={x:null,w:false};save();render();
}
function setMod(k){if(k==="w")mod.w=!mod.w;else mod.x=mod.x===k?null:k;render()}
function undo(){
 var i=S.inn,l=S.log[i];
 if(l.length){var e=l.pop();S.cur[i]=e.s;}
 else if(i===1){S.inn=0}
 mod={x:null,w:false};save();render();
}
function swapEnds(){var c=S.cur[S.inn],t=c.st;c.st=c.ns;c.ns=t;save();render()}
function retire(){var i=S.inn,c=S.cur[i];if(!c.st||ended(i))return;S.log[i].push({k:"ret",t:0,l:false,w:false,x:null,b:c.st,bw:c.bw,br:0,s:{st:c.st,ns:c.ns,bw:c.bw}});c.st=null;save();render()}
function rename(n){var v=prompt("Rename player",n);v=v&&v.trim();if(!v||v===n)return;if(S.sq[0].concat(S.sq[1]).indexOf(v)>=0){alert("That name is already used.");return}var f=function(x){return x===n?v:x};S.sq=S.sq.map(function(a){return a.map(f)});S.log.forEach(function(l){l.forEach(function(e){e.b=f(e.b);e.bw=f(e.bw);if(e.out)e.out=f(e.out);e.s.st=f(e.s.st);e.s.ns=f(e.s.ns);e.s.bw=f(e.s.bw)})});S.cur=S.cur.map(function(c){return{st:f(c.st),ns:f(c.ns),bw:f(c.bw)}});save();render()}
function partner(i){var r=0,b=0;S.log[i].forEach(function(e){if(e.w){r=0;b=0}else if(!e.k){r+=e.t;if(e.l)b++}});return r+" ("+b+")"}
function fow(i){var r=0,b=0,w=0,o=[];S.log[i].forEach(function(e){r+=e.t;if(e.l)b++;if(e.w){w++;o.push(w+"-"+r+" ("+(e.out||e.b)+", "+ovr(b)+")")}});return o.join(", ")}
function share(){var t=S.a+" vs "+S.b+" ("+S.ov+" overs)\n";[0,1].forEach(function(i){if(!S.log[i].length)return;var c=calc(i),st=stats(i);t+="\n"+team(i)+": "+c.r+"/"+c.w+" ("+ovr(c.b)+" ov)\n";S.sq[i].forEach(function(n){var b=st.B[n];if(b&&(b.b||b.o))t+="  "+n+" "+b.r+" ("+b.b+") "+(b.o?(b.how||"out"):"not out")+"\n"});Object.keys(st.W).forEach(function(n){var w=st.W[n];t+="  "+n+" "+ovr(w.b)+"-"+w.r+"-"+w.w+"\n"})});if(ended(1))t+="\n"+result();if(navigator.share){navigator.share({text:t}).catch(function(){})}else if(navigator.clipboard){navigator.clipboard.writeText(t).then(function(){alert("Scorecard copied")},function(){prompt("Copy scorecard",t)})}else prompt("Copy scorecard",t)}
var V="match",LIVE=null;
function loadA(){try{return JSON.parse(localStorage.getItem("cricket-arch-v1"))||[]}catch(e){return[]}}
function saveA(a){try{localStorage.setItem("cricket-arch-v1",JSON.stringify(a))}catch(e){}}
function loadT(){try{return JSON.parse(localStorage.getItem("cricket-teams-v1"))||{}}catch(e){return{}}}
function saveT(t){try{localStorage.setItem("cricket-teams-v1",JSON.stringify(t))}catch(e){}}
function addArchive(p){var r=p?"Incomplete":result(),m=JSON.parse(JSON.stringify(S));m.res=r;var A=loadA();A.unshift({id:Date.now(),date:new Date().toLocaleDateString(),res:r,m:m});saveA(A)}
function fillTeam(el,id){var T=loadT(),n=el.value.trim();if(T[n])document.getElementById(id).value=T[n].join("\n")}
function go(v){if(LVU){LVU();LVU=null}if(v==="lo"){auLogout();return}if(LIVE){S=LIVE;LIVE=null}V=v;render()}

function overData(i){var O=[],cur=null,n=0;S.log[i].forEach(function(e){if(e.k)return;if(!cur){cur={no:O.length+1,balls:[],r:0,w:0,bw:e.bw,lb:0};O.push(cur)}
 if(e.l)cur.lb++;cur.balls.push({e:e,lab:(cur.no-1)+"."+(e.l?cur.lb:cur.lb+1)});cur.r+=e.t;if(e.w)cur.w++;if(e.l){n++;if(n%6===0)cur=null}});return O}
function desc(e){var r=(e.x==="wd"||e.x==="nb")?e.t-1:e.t,p=r?" + "+r:"";
 if(e.w)return"OUT! "+esc(e.dt||"Bowled")+" ("+esc(e.out||e.b)+")"+p;
 if(e.x==="wd")return"Wide"+p;if(e.x==="nb")return"No ball"+p;
 if(e.x==="bye")return"Bye, "+r+(r===1?" run":" runs");if(e.x==="lb")return"Leg bye, "+r+(r===1?" run":" runs");
 return r===0?"no run (dot ball)":r===4?"FOUR!":r===6?"SIX!":r+(r===1?" run":" runs")}
function line(b){var e=b.e;return '<div class="cm"><b>'+b.lab+'</b>'+chipOf(e)+' '+esc(e.bw)+' to '+esc(e.b)+', '+desc(e)+'</div>'}
function overHtml(i){var O=overData(i);if(!O.length)return"";return '<p class="hint">Tap an over to see each ball</p>'+O.map(function(o){return '<details class="ov"><summary>Over '+o.no+' · '+esc(o.bw)+' · '+o.r+' runs'+(o.w?' · '+o.w+'W':'')+'<span>'+o.balls.map(function(b){return chipOf(b.e)}).join("")+'</span></summary>'+o.balls.map(line).join("")+'</details>'}).join("")}
function commPg(){var h="";[1,0].forEach(function(i){var O=overData(i);if(!O.length)return;h+='<div class="card"><b>'+esc(team(i))+' – Commentary</b>'+O.slice().reverse().map(function(o){return '<div class="hint" style="margin:10px 0 2px"><b>Over '+o.no+'</b> · '+esc(o.bw)+' · '+o.r+' runs'+(o.w?' · '+o.w+' wkt':'')+'</div>'+o.balls.slice().reverse().map(line).join("")}).join("")+'</div>'});return h||'<div class="card"><p class="hint">No balls yet. Start scoring and the commentary appears here.</p></div>'}

/* ===== Login + passcode system (same online database and rules as the Cricket Auction app) ===== */
var AFB="https://cricketscorer-8ffab-default-rtdb.asia-southeast1.firebasedatabase.app",AOS="a7f3",AOH="7b3f88bf6dcc63aeb65d114e1292215f2112b4e8a480ef70e55559ef6938cbe2",AME=null,AOWN=0,AAM="login",ACUR=null,ATR=0,AUNS=null,ACODE=null,ACT=0,ADP=null,AREQ=[],ADPL=[],ASUB=0;
try{AME=sessionStorage.getItem("sc_me")||null;AOWN=+sessionStorage.getItem("sc_own")||0}catch(e){}
var ajf=function(p,m,b){return fetch(AFB+"/"+p+".json",{method:m||"GET",body:b==null?undefined:JSON.stringify(b)}).then(function(r){if(!r.ok)throw{code:"http_"+r.status};return r.json()})};
var asn=function(id,v){return{id:id,exists:v!=null,data:function(){return v==null?undefined:v}}};
var apoll=function(fn,next,err){var on=1,last=null;var tick=async function(){if(!on)return;try{var v=await fn(),j=JSON.stringify(v);if(j!==last){last=j;next(v)}}catch(e){err&&err(e)}if(on)setTimeout(tick,2000)};tick();return function(){on=0}};
var adb={doc:function(p){var id=p.split("/").pop();return{get:async function(){return asn(id,await ajf(p))},set:function(d){return ajf(p,"PUT",d)},update:function(d){return ajf(p,"PATCH",d)},delete:function(){return ajf(p,"DELETE")},onSnapshot:function(n,e){return apoll(function(){return ajf(p)},function(v){n(asn(id,v))},e)}}},
collection:function(p){return{onSnapshot:function(n,e){return apoll(function(){return ajf(p)},function(v){n({docs:Object.entries(v||{}).map(function(k){return asn(k[0],k[1])})})},e)}}}};
var asha=async function(t){return Array.from(new Uint8Array(await crypto.subtle.digest("SHA-256",new TextEncoder().encode(t)))).map(function(b){return b.toString(16).padStart(2,"0")}).join("")};
function auSess(){try{sessionStorage.setItem("sc_me",AME||"");sessionStorage.setItem("sc_own",AOWN)}catch(e){}}
function $a(i){return document.getElementById(i)}
function auLogin(m){$a("app").innerHTML='<div class="card"><h2 style="margin:0 0 8px">🏏 Cricket Scorer – Log in</h2><div class="mods"><button class="'+(AAM=="login"?"on":"")+'" onclick="AAM=\'login\';auLogin()">Login</button><button class="'+(AAM=="reg"?"on":"")+'" onclick="AAM=\'reg\';auLogin()">Register</button></div><p></p><input id="lu" placeholder="Username" autocapitalize="none" style="width:100%"><p></p><input id="lp" type="password" placeholder="Password" style="width:100%"><p class="hint" style="color:var(--red)">'+(m||"")+'</p><div class="row"><button class="go" onclick="auAuth()">'+(AAM=="login"?"Login":"Create account")+'</button></div></div>'}
async function auAuth(){var u=$a("lu").value.trim().toLowerCase(),p=$a("lp").value;if(!/^[a-z0-9_]{3,20}$/.test(u))return auLogin("Username: 3-20 letters, numbers or _");

  [["wd","Wd"],["nb","Nb"],["bye","Bye"],["lb","LB"]].map(function(m){return '<button class="'+(mod.x===m[0]?"on":"")+'" onclick="setMod(\''+m[0]+'\')">'+m[1]+'</button>'}).join("")+
  '<button class="wk '+(mod.w?"on":"")+'" onclick="setMod(\'w\')">Out</button></div>'+(mod.w?'<div class="row" style="margin:0 0 10px"><select id="dt" aria-label="How out">'+["Bowled","Caught","LBW","Run out","Stumped","Hit wicket","Other"].map(function(d){return '<option>'+d+'</option>'}).join("")+'</select><select id="dw" aria-label="Who is out"><option value="st">'+esc(cur.st)+'</option><option value="ns">'+esc(cur.ns)+'</option></select></div>':'')+
  '<div class="pad">'+[0,1,2,3,4,6].map(function(n){return '<button class="'+(n>=4?"b"+n:"")+'" onclick="add('+n+')">'+(n===0?"Dot":n)+'</button>'}).join("")+'</div>'+
  '<p class="hint">'+(mod.x||mod.w?'Now tap the runs'+(mod.w?' · choose how out above':''):'Pick Wd, Nb, Bye, LB or Out first. Tap a player name to rename.')+'</p>';
 }else if(i===0)h+='<div class="row"><button class="go" onclick="nextInn()">Start second innings</button></div>';
 h+=(!done&&cur.st&&cur.ns&&cur.bw?'<div class="row"><button onclick="swapEnds()">Swap batters</button><button onclick="retire()">Retire striker</button></div>':'')+'<div class="row"><button onclick="undo()">Undo last ball</button><button onclick="reset()">New match</button></div><div style="height:12px"></div>';
 if(c.b||done)h+=card(i)+chart(i);
 if(i===1&&calc(0).b)h+=card(0)+chart(0);
 el.innerHTML=h;
}
AME?render():auLogin();
</script>
